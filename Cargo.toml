[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/lattice", "apps/lattice-cli", "xtask"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/shaansundar/lattice"

[workspace.dependencies]
# internal
lattice-core = { path = "crates/core" }
lattice-numfmt = { path = "crates/numfmt" }
lattice-formula = { path = "crates/formula" }
lattice-functions = { path = "crates/functions" }
lattice-model = { path = "crates/model" }
lattice-calc = { path = "crates/calc" }
lattice-xlsx = { path = "crates/xlsx" }
lattice-chart = { path = "crates/chart" }
lattice-engine = { path = "crates/engine" }
lattice-ui-egui = { path = "crates/ui-egui" }
lattice-mcp = { path = "crates/mcp" }
lattice-assistant = { path = "crates/assistant" }
lattice-pdf = { path = "crates/pdf" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
rayon = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# assistant (desktop only): model downloads over HTTPS (rustls, bundled web roots) and their integrity check
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
sha2 = { version = "0.11", default-features = false }

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }
# The desktop's preferred language, for the first-run interface language (native only).
sys-locale = "0.3"
# Font parser egui's epaint uses; the UI validates system font files with it before handing them
# to egui, which panics on a file it can't parse. Same version as epaint's, so no second copy.
skrifa = { version = "0.44", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
